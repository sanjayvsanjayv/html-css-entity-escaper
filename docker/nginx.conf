server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes liveness/readiness probes and the Docker HEALTHCHECK
    # both hit this. Kept dependency-free (no PHP/backend needed).
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    server_tokens off;
}
